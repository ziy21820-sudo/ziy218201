<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的谷子</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f4fa;color:#2d2a32;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1000px;margin:0 auto;padding:20px 16px 80px}
/* ===== 头部 ===== */
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:700;color:#4a3a6b;letter-spacing:-0.5px}
.logo small{font-size:14px;font-weight:400;color:#9a94a5;margin-left:6px}
.header-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.header-actions .btn{border:0;border-radius:10px;padding:6px 12px;font-size:12px;background:#ece8f2;color:#4a4260;transition:.15s}
.header-actions .btn:active{background:#ddd8e6}
.header-actions .btn-primary{background:#6b5b8a;color:#fff}
.header-actions .btn-primary:active{background:#5a4c75}
/* ===== 统计卡片 ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:16px;padding:14px 12px;box-shadow:0 2px 10px rgba(60,50,80,.04)}
.stat-card .label{font-size:11px;color:#a8a0b0;letter-spacing:0.3px}
.stat-card .value{font-size:28px;font-weight:700;color:#3a324a;line-height:1.2;margin-top:2px}
/* ===== 分类条形图 ===== */
.chart-section{background:#fff;border-radius:16px;padding:16px 14px;margin-bottom:16px;box-shadow:0 2px 10px rgba(60,50,80,.04)}
.chart-section .chart-title{font-size:13px;font-weight:600;color:#4a4260;margin-bottom:12px;letter-spacing:0.3px}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chart-row .label{width:48px;font-size:12px;color:#5a5268;flex-shrink:0;text-align:right}
.chart-row .bar-wrap{flex:1;background:#f0ecf6;border-radius:12px;height:20px;overflow:hidden;position:relative}
.chart-row .bar{height:100%;border-radius:12px;background:linear-gradient(90deg,#9b89b8,#6b5b8a);transition:width .3s;width:0%}
.chart-row .num{width:32px;font-size:12px;color:#5a5268;flex-shrink:0;text-align:right}
/* ===== 筛选与搜索 ===== */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:140px;border:0;background:#fff;padding:10px 14px;border-radius:20px;outline:none;box-shadow:0 2px 8px rgba(60,50,80,.04);font-size:13px}
.filter{border:0;background:#fff;padding:0 14px;border-radius:20px;color:#5a5268;font-size:13px;box-shadow:0 2px 8px rgba(60,50,80,.04)}
.categories{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.category{border:0;background:#edeaf2;color:#6a6278;padding:6px 14px;border-radius:30px;font-size:12px}
.category.active{background:#6b5b8a;color:#fff}
/* ===== 谷子网格 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.item{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(60,50,80,.04);transition:.15s}
.item:active{transform:scale(0.97)}
.item-img,.no-img{width:100%;aspect-ratio:1/1}
.item-img{object-fit:cover;background:#edeaf3}
.no-img{display:flex;align-items:center;justify-content:center;color:#b5acbf;background:#edeaf3;font-size:13px}
.item-info{padding:10px 12px 12px}
.item-name{font-weight:600;font-size:13px;color:#3a324a;line-height:1.3;word-break:break-word}
.item-meta{font-size:11px;color:#a098aa;line-height:1.6;margin-top:2px}
.tag{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:20px;background:#f0ecf6;color:#6b5b8a;font-size:10px}
/* ===== 弹窗 ===== */
.modal,.bulk-modal{display:none;position:fixed;inset:0;background:rgba(40,35,50,.45);align-items:center;justify-content:center;padding:14px;z-index:30}
.modal.show,.bulk-modal.show{display:flex}
.modal-box{width:min(580px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:24px 20px}
.bulk-box{width:min(1200px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:20px}
.modal-title{font-size:21px;font-weight:700;margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-item{display:flex;flex-direction:column;gap:5px}
.form-item.full{grid-column:1/-1}
.form-item label{font-size:12px;color:#7a7282}
.form-item input,.form-item select,.form-item textarea{border:1px solid #e3dee8;border-radius:12px;padding:9px 12px;outline:none;font-size:13px;background:#fff}
.form-item textarea{min-height:70px;resize:vertical}
.image-preview{width:100px;height:100px;object-fit:cover;border-radius:12px;margin-top:6px;display:none}
.modal-actions,.bulk-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.modal-actions button,.bulk-actions button{border:0;padding:10px 16px;border-radius:12px;font-size:13px}
.btn-cancel{background:#edeaf2;color:#5a5268}
.btn-save{background:#6b5b8a;color:#fff}
.btn-delete{background:#f3e4e4;color:#a55a6a}
/* ===== 批量 ===== */
.bulk-table-wrap{overflow:auto;border:1px solid #e5dfe9;border-radius:12px;margin-top:6px}
.bulk-table{width:100%;border-collapse:collapse;min-width:1100px}
.bulk-table th,.bulk-table td{border-bottom:1px solid #eee9f0;padding:5px 4px}
.bulk-table th{background:#faf8fc;color:#7a7282;font-size:11px;white-space:nowrap}
.bulk-table input,.bulk-table select{width:100%;min-width:65px;padding:6px 8px;border:1px solid #e3dee8;border-radius:8px;background:#fff;font-size:12px}
.paste-area{display:none;width:100%;min-height:120px;margin-top:10px;border:1px solid #e5dfe9;border-radius:12px;padding:10px;font-size:12px}
.footer{text-align:center;padding:30px 0 6px;font-size:12px;color:#bdb5c5;letter-spacing:0.3px}
/* ===== 响应式 ===== */
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}}
@media(max-width:480px){.logo{font-size:20px}.stat-card .value{font-size:22px}.header-actions .btn{font-size:10px;padding:4px 8px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="logo">我的谷子 <small>✦ 图鉴</small></div>
  <div class="header-actions">
    <button class="btn" onclick="openBulkModal()">批量</button>
    <button class="btn" onclick="exportGoodsBackup()">导出</button>
    <button class="btn" onclick="document.getElementById('importBackup').click()">导入</button>
    <button class="btn" onclick="toggleBgColor()">底色</button>
    <input id="importBackup" type="file" accept=".json,application/json" style="display:none" onchange="importGoodsBackup(event)">
    <button class="btn btn-primary" onclick="openModal()">＋添加</button>
  </div>
</header>

<section class="stats">
  <div class="stat-card"><div class="label">收藏数量</div><div class="value" id="count">0</div></div>
  <div class="stat-card"><div class="label">收藏款数</div><div class="value" id="pieces">0</div></div>
  <div class="stat-card"><div class="label">累计投入</div><div class="value">¥<span id="total">0</span></div></div>
  <div class="stat-card"><div class="label">未拥有</div><div class="value" id="wanted">0</div></div>
</section>

<section class="chart-section" id="chartSection">
  <div class="chart-title">📊 吃谷分类</div>
  <div id="chartContainer"></div>
</section>

<section class="toolbar">
  <input id="search" class="search" placeholder="搜索谷子、角色、作品…" oninput="render()">
  <select id="statusFilter" class="filter" onchange="render()">
    <option value="all">全部状态</option>
    <option value="已拥有">已拥有</option>
  </select>
</section>

<section class="categories" id="categoryBar">
  <button class="category active" onclick="setType('all',this)">全部</button>
  <button class="category" onclick="setType('吧唧',this)">吧唧</button>
  <button class="category" onclick="setType('亚克力',this)">亚克力</button>
  <button class="category" onclick="setType('立牌',this)">立牌</button>
  <button class="category" onclick="setType('卡片',this)">卡片</button>
  <button class="category" onclick="setType('色纸',this)">色纸</button>
  <button class="category" onclick="setType('毛绒',this)">毛绒</button>
  <button class="category" onclick="setType('挂件',this)">挂件</button>
  <button class="category" onclick="setType('其他',this)">其他</button>
</section>

<main id="grid" class="grid"></main>
<div class="footer">我超甜检测 2026</div>
</div>

<!-- 弹窗略，功能保持不变 -->
<div id="modal" class="modal"><div class="modal-box">
  <div class="modal-title" id="modalTitle">添加谷子</div>
  <div class="form-grid">
    <div class="form-item full"><label>图片</label><input type="file" accept="image/*" onchange="previewImage(event)"><img id="preview" class="image-preview"></div>
    <div class="form-item full"><label>谷子名称</label><input id="name" placeholder="例如：叶瑄58mm吧唧"></div>
    <div class="form-item"><label>作品/IP</label><input id="work" placeholder="时空中的绘旅人"></div>
    <div class="form-item"><label>角色</label><input id="character" placeholder="叶瑄"></div>
    <div class="form-item"><label>类型</label><input id="type" placeholder="吧唧" list="typeList"><datalist id="typeList"></datalist></div>
    <div class="form-item"><label>系列</label><input id="series" placeholder="白色情人节"></div>
    <div class="form-item"><label>尺寸</label><input id="size" placeholder="58mm"></div>
    <div class="form-item"><label>数量</label><input id="quantity" type="number" min="1" value="1"></div>
    <div class="form-item"><label>单价（元）</label><input id="price" type="number" min="0" step="0.01"></div>
    <div class="form-item"><label>购买日期</label><input id="date" type="date"></div>
    <div class="form-item"><label>购买渠道</label><input id="shop" placeholder="谷店/闲鱼/官方"></div>
    <div class="form-item"><label>状态</label><input id="status" placeholder="已拥有" list="statusList"><datalist id="statusList"></datalist></div>
    <div class="form-item full"><label>备注</label><textarea id="memo" placeholder="版本、特典、瑕疵…"></textarea></div>
  </div>
  <div class="modal-actions">
    <button class="btn-cancel" onclick="closeModal()">取消</button>
    <button id="deleteBtn" class="btn-delete" style="display:none" onclick="deleteItem()">删除</button>
    <button class="btn-save" onclick="saveItem()">保存</button>
  </div>
</div></div>

<div id="bulkModal" class="bulk-modal"><div class="bulk-box">
  <div class="modal-title">批量添加谷子</div>
  <div class="bulk-help" style="font-size:12px;color:#8b8491;margin-bottom:6px">每行一款，可直接复制粘贴表格内容</div>
  <div class="bulk-note" style="background:#f3eef9;padding:8px 12px;border-radius:10px;font-size:11px;color:#695d7a;margin-bottom:10px">列顺序：名称｜作品/IP｜角色｜类型｜系列｜尺寸｜数量｜单价｜日期｜渠道｜状态｜备注</div>
  <div id="bulkTableWrap" class="bulk-table-wrap"></div>
  <textarea id="bulkPasteArea" class="paste-area" placeholder="粘贴表格内容…"></textarea>
  <div class="bulk-actions">
    <button class="btn-cancel" onclick="addBulkRow()">＋行</button>
    <button class="btn-cancel" onclick="addBulkRows(10)">＋10行</button>
    <button class="btn-cancel" onclick="togglePasteArea()">📋粘贴</button>
    <button class="btn-cancel" onclick="downloadCSVTemplate()">↓模板</button>
    <button class="btn-cancel" onclick="document.getElementById('bulkCSV').click()">↑CSV</button>
    <input id="bulkCSV" type="file" accept=".csv,.txt" style="display:none" onchange="importBulkCSV(event)">
    <button class="btn-save" onclick="saveBulkItems()">保存全部</button>
    <button class="btn-cancel" onclick="closeBulkModal()">取消</button>
  </div>
</div></div>

<script>
let items=JSON.parse(localStorage.getItem("goodsCollection")||"[]");
let currentType="all",editingId=null,currentImage="";
let bgIndex=0;
const bgColors=['#f7f4fa','#f0f5f0','#faf3ef','#f0f2f8','#f8f0f2'];
const BULK_COLS=["name","work","character","type","series","size","quantity","price","date","shop","status","memo"];
const BULK_LABELS=["名称","作品/IP","角色","类型","系列","尺寸","数量","单价","日期","渠道","状态","备注"];

function saveData(){localStorage.setItem("goodsCollection",JSON.stringify(items));}
function toggleBgColor(){bgIndex=(bgIndex+1)%bgColors.length;document.body.style.background=bgColors[bgIndex]}
function openModal(id=null){editingId=id;currentImage="";document.getElementById("modal").classList.add("show");document.getElementById("modalTitle").textContent=id?"编辑谷子":"添加谷子";document.getElementById("deleteBtn").style.display=id?"block":"none";if(id){const item=items.find(x=>x.id===id);if(!item)return;["name","work","character","series","size","quantity","price","date","shop","memo"].forEach(k=>document.getElementById(k).value=item[k]??"");document.getElementById("type").value=item.type||"";document.getElementById("status").value=item.status||"";currentImage=item.image||"";const p=document.getElementById("preview");if(currentImage){p.src=currentImage;p.style.display="block"}else p.style.display="none"}else clearForm()}
function clearForm(){document.querySelectorAll("#modal input,#modal textarea").forEach(el=>{if(el.type!=="file")el.value=""});document.getElementById("quantity").value=1;document.getElementById("type").value="";document.getElementById("status").value="";document.getElementById("preview").style.display="none"}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function previewImage(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{currentImage=ev.target.result;const p=document.getElementById("preview");p.src=currentImage;p.style.display="block"};r.readAsDataURL(file)}
function saveItem(){const name=document.getElementById("name").value.trim();if(!name){alert("请填写谷子名称");return}const item={id:editingId||Date.now()+Math.random(),name,work:document.getElementById("work").value.trim(),character:document.getElementById("character").value.trim(),type:document.getElementById("type").value.trim()||"其他",series:document.getElementById("series").value.trim(),size:document.getElementById("size").value.trim(),quantity:Number(document.getElementById("quantity").value)||1,price:Number(document.getElementById("price").value)||0,date:document.getElementById("date").value,shop:document.getElementById("shop").value.trim(),status:document.getElementById("status").value.trim()||"已拥有",memo:document.getElementById("memo").value.trim(),image:currentImage};if(editingId){const i=items.findIndex(x=>x.id===editingId);if(i>=0)items[i]=item}else items.unshift(item);saveData();closeModal();render()}
function deleteItem(){if(!editingId)return;if(!confirm("确定删除吗？"))return;items=items.filter(x=>x.id!==editingId);saveData();closeModal();render()}
function setType(type,btn){currentType=type;document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));btn.classList.add("active");render()}
function render(){
  const keyword=(document.getElementById("search").value||"").toLowerCase();
  const status=document.getElementById("statusFilter").value;
  const list=items.filter(item=>{
    const text=[item.name,item.work,item.character,item.series,item.type,item.size,item.shop,item.memo].join(" ").toLowerCase();
    return text.includes(keyword)&&(currentType==="all"||item.type===currentType)&&(status==="all"||item.status===status);
  });
  const grid=document.getElementById("grid");
  grid.innerHTML=list.length?list.map(createCard).join(""):`<div style="grid-column:1/-1;background:white;border-radius:20px;padding:60px 20px;text-align:center;color:#b5acbf"><div style="font-size:36px">✦</div><div style="margin-top:10px;font-size:14px">还没有谷子，点击添加吧</div></div>`;
  updateStats();updateChart();updateDatalists();
}
function createCard(item){
  const image=item.image?`<img class="item-img" src="${escapeAttr(item.image)}" alt="">`:`<div class="no-img">📦</div>`;
  return `<div class="item" onclick="openModal(${JSON.stringify(item.id)})">${image}<div class="item-info"><div class="item-name">${escapeHtml(item.name)}</div><div class="item-meta">${escapeHtml(item.work||"")}${item.character?" · "+escapeHtml(item.character):""}<br>×${Number(item.quantity||1)} · ¥${(Number(item.price)*Number(item.quantity||1)).toFixed(2)}</div><span class="tag">${escapeHtml(item.status||"已拥有")}</span></div></div>`;
}
function escapeHtml(t){return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function escapeAttr(t){return String(t??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;")}
function updateStats(){
  let pieces=0,total=0,notOwned=0;
  items.forEach(i=>{const q=Number(i.quantity)||1,p=Number(i.price)||0;pieces+=q;total+=q*p;if(i.status!=="已拥有")notOwned++});
  document.getElementById("count").textContent=items.length;
  document.getElementById("pieces").textContent=pieces;
  document.getElementById("total").textContent=total.toFixed(2);
  document.getElementById("wanted").textContent=notOwned;
}
function updateChart(){
  const map={};items.forEach(i=>{const t=i.type||"其他";map[t]=(map[t]||0)+Number(i.quantity||1)});
  const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const container=document.getElementById("chartContainer");
  if(!sorted.length){container.innerHTML='<div style="color:#b5acbf;font-size:12px;padding:6px 0">暂无数据</div>';return}
  const max=sorted[0][1];
  container.innerHTML=sorted.map(([type,num])=>`
    <div class="chart-row">
      <span class="label">${type}</span>
      <div class="bar-wrap"><div class="bar" style="width:${max?Math.max(4,(num/max)*100):0}%"></div></div>
      <span class="num">${num}</span>
    </div>
  `).join("");
}
function updateDatalists(){
  const types=new Set();const statuses=new Set();
  items.forEach(i=>{if(i.type)types.add(i.type);if(i.status)statuses.add(i.status)});
  const typeList=document.getElementById("typeList");typeList.innerHTML="";types.forEach(t=>{const o=document.createElement("option");o.value=t;typeList.appendChild(o)});
  const statusList=document.getElementById("statusList");statusList.innerHTML="";statuses.forEach(s=>{const o=document.createElement("option");o.value=s;statusList.appendChild(o)});
}
function exportGoodsBackup(){
  const data={app:"我的谷子",version:2,exportedAt:new Date().toISOString(),items};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
  downloadBlob(blob,"谷子备份_"+new Date().toISOString().slice(0,10)+".json");
}
function importGoodsBackup(e){
  const file=e.target.files[0];e.target.value="";if(!file)return;
  const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);const incoming=Array.isArray(obj)?obj:obj.items;if(!Array.isArray(incoming))throw new Error("");if(!confirm("导入将覆盖当前数据，确定继续吗？"))return;items=incoming.map(normalizeItem);saveData();render();alert("导入成功 "+items.length+" 件")}catch(e){alert("文件格式不正确")}};r.readAsText(file,"utf-8")}
function normalizeItem(i){return {id:i.id??Date.now()+Math.random(),name:String(i.name??""),work:String(i.work??""),character:String(i.character??""),type:String(i.type??""),series:String(i.series??""),size:String(i.size??""),quantity:Number(i.quantity)||1,price:Number(i.price)||0,date:String(i.date??""),shop:String(i.shop??""),status:String(i.status??""),memo:String(i.memo??""),image:String(i.image??"")}}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

// 批量
let bulkRows=[];
function blankBulkRow(){return {name:"",work:"",character:"",type:"",series:"",size:"",quantity:1,price:"",date:"",shop:"",status:"",memo:""}}
function openBulkModal(){document.getElementById("bulkModal").classList.add("show");document.getElementById("bulkPasteArea").style.display="none";bulkRows=[blankBulkRow()];renderBulkTable()}
function closeBulkModal(){document.getElementById("bulkModal").classList.remove("show")}
function addBulkRow(){bulkRows.push(blankBulkRow());renderBulkTable()}
function addBulkRows(n){for(let i=0;i<n;i++)bulkRows.push(blankBulkRow());renderBulkTable()}
function renderBulkTable(){
  const wrap=document.getElementById("bulkTableWrap");
  let h="<table class='bulk-table'><thead><tr><th>#</th>";
  BULK_LABELS.forEach(x=>h+="<th>"+x+"</th>");
  h+="<th>操作</th></tr></thead><tbody>";
  bulkRows.forEach((row,ri)=>{
    h+="<tr><td>"+(ri+1)+"</td>";
    BULK_COLS.forEach((key,ci)=>{
      if(key==="quantity")h+="<td><input type='number' min='1' value='"+escapeAttr(row[key])+"' onchange='bulkRows["+ri+"].quantity=this.value'></td>";
      else if(key==="price")h+="<td><input type='number' min='0' step='0.01' value='"+escapeAttr(row[key])+"' onchange='bulkRows["+ri+"].price=this.value'></td>";
      else if(key==="date")h+="<td><input type='date' value='"+escapeAttr(row[key])+"' onchange='bulkRows["+ri+"].date=this.value'></td>";
      else h+="<td><input value='"+escapeAttr(row[key])+"' onchange='bulkRows["+ri+"]."+key+"=this.value'></td>";
    });
    h+="<td><button class='btn-cancel' onclick='removeBulkRow("+ri+")'>✕</button></td></tr>";
  });
  h+="</tbody></table>";
  wrap.innerHTML=h;
}
function removeBulkRow(i){bulkRows.splice(i,1);if(!bulkRows.length)bulkRows=[blankBulkRow()];renderBulkTable()}
function togglePasteArea(){const a=document.getElementById("bulkPasteArea");a.style.display=a.style.display==="block"?"none":"block";if(a.style.display==="block")a.focus()}
function applyPastedTable(){
  const text=document.getElementById("bulkPasteArea").value.trim();if(!text)return;
  const rows=text.split(/\r?\n/).map(line=>line.split(/\t|,+/));
  const first=rows[0].map(x=>x.trim());
  const hasHeader=first.some(x=>x==="名称"||x==="作品"||x==="角色");
  const data=hasHeader?rows.slice(1):rows;
  bulkRows=data.filter(r=>r.some(x=>x.trim()!=="")).map(r=>{const a=blankBulkRow();BULK_COLS.forEach((k,i)=>{if(r[i]!==undefined)a[k]=r[i].trim()});a.quantity=Number(a.quantity)||1;a.price=Number(a.price)||0;return a});
  if(!bulkRows.length)bulkRows=[blankBulkRow()];
  renderBulkTable();document.getElementById("bulkPasteArea").style.display="none"
}
document.addEventListener("paste",e=>{const a=document.getElementById("bulkPasteArea");if(document.getElementById("bulkModal").classList.contains("show")&&document.activeElement===a)setTimeout(applyPastedTable,0)});
function downloadCSVTemplate(){
  const header=BULK_LABELS.join(",");
  downloadBlob(new Blob(["\uFEFF"+header+"\n示例谷子,绘旅人,叶瑄,吧唧,白情,58mm,1,15,2026-08-20,闲鱼,已拥有,\n"],{type:"text/csv;charset=utf-8"}),"谷子模板.csv");
}
function parseCSV(text){
  const rows=[];let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}if(c==='"'){quoted=!quoted;continue}if(c===","&&!quoted){row.push(cell);cell="";continue}if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&n==="\n")i++;row.push(cell);cell="";if(row.some(x=>x!==""))rows.push(row);row=[];continue}cell+=c}
  if(cell!==""||row.length){row.push(cell);if(row.some(x=>x!==""))rows.push(row)}
  return rows
}
function importBulkCSV(e){const file=e.target.files[0];e.target.value="";if(!file)return;const r=new FileReader();r.onload=()=>{const rows=parseCSV(String(r.result).replace(/^\uFEFF/,""));if(!rows.length){alert("无数据");return}const first=rows[0].map(x=>x.trim());const data=first.some(x=>x==="名称"||x==="作品")?rows.slice(1):rows;bulkRows=data.filter(x=>x.some(v=>v.trim()!=="")).map(r=>{const a=blankBulkRow();BULK_COLS.forEach((k,i)=>{if(r[i]!==undefined)a[k]=r[i].trim()});a.quantity=Number(a.quantity)||1;a.price=Number(a.price)||0;return a});if(!bulkRows.length)bulkRows=[blankBulkRow()];renderBulkTable()};r.readAsText(file,"utf-8")}
function saveBulkItems(){
  if(document.getElementById("bulkPasteArea").value.trim())applyPastedTable();
  const valid=bulkRows.filter(r=>String(r.name||"").trim());
  if(!valid.length){alert("请填写谷子名称");return}
  const now=Date.now();
  valid.forEach((r,i)=>items.unshift(normalizeItem({...r,id:now+i+Math.random()})));
  saveData();closeBulkModal();render();alert("已添加 "+valid.length+" 件")
}
document.getElementById("modal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal()});
document.getElementById("bulkModal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeBulkModal()});
render();
</script>
